<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Dino Runner — Kaiju Edition</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{display:block;position:fixed;inset:0}
#barWrap{position:fixed;top:0;left:0;right:0;height:6px;background:rgba(255,255,255,.1);z-index:12}
#bar{height:100%;width:0;background:linear-gradient(90deg,#48dbfb,#ffe066,#ff6b6b);box-shadow:0 0 14px rgba(72,219,251,.85);transition:width .08s linear}
#hud{position:fixed;top:0;left:0;right:0;padding:16px 20px;pointer-events:none;z-index:10;color:#fff}
.row{display:flex;gap:28px;align-items:flex-end}
.stat{display:flex;flex-direction:column}
.label{font-size:10px;letter-spacing:2.5px;opacity:.65;font-weight:800}
.value{font-size:26px;font-weight:800;line-height:1.1;text-shadow:0 2px 14px rgba(0,0,0,.75)}
#scoreVal{color:#8fe9ff}#bestVal{color:#c8c8d0}#levelVal{color:#ffe066}
#themeName{position:fixed;left:20px;bottom:18px;z-index:10;color:#fff;opacity:.75;font-size:12px;letter-spacing:3px;font-weight:700;text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.8);pointer-events:none}
#banner{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:14;pointer-events:none;opacity:0;transform:scale(.86);transition:opacity .22s,transform .22s cubic-bezier(.2,1.4,.5,1);text-align:center}
#banner.show{opacity:1;transform:scale(1)}
#bannerTitle{font-size:64px;font-weight:900;letter-spacing:6px;background:linear-gradient(90deg,#ffe066,#ff6b6b,#48dbfb,#ffe066);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 6px 26px rgba(0,0,0,.85))}
#bannerSub{font-size:20px;letter-spacing:8px;color:#fff;margin-top:6px;text-transform:uppercase;text-shadow:0 3px 16px rgba(0,0,0,.9);font-weight:700}
#bannerBonus{margin-top:16px;font-size:22px;font-weight:800;color:#7dffb0;text-shadow:0 3px 16px rgba(0,0,0,.9)}
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,20,40,.72),rgba(0,0,0,.92));backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);padding:24px;text-align:center;transition:opacity .25s}
#overlay.hidden{opacity:0;pointer-events:none}
.panel{max-width:620px;width:100%}
#ovTitle{font-size:clamp(34px,8vw,62px);font-weight:900;letter-spacing:3px;margin:0 0 10px;background:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#ff9ff3,#ff6b6b);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:200% center}}
#ovSub{color:#b9c6d6;font-size:15px;margin:0 0 22px;letter-spacing:1px}
#ovControls{color:#cfd8e3;font-size:14px;line-height:2;margin-bottom:22px}
#ovControls b{color:#ffe066;background:rgba(255,255,255,.08);padding:3px 9px;border-radius:6px;border:1px solid rgba(255,255,255,.15);font-size:12px;letter-spacing:1px}
#ovScore{font-size:22px;font-weight:800;color:#ffe066;margin-bottom:20px;min-height:26px}
#ovBtn{padding:16px 54px;font-size:19px;font-weight:900;letter-spacing:3px;border:none;border-radius:60px;background:linear-gradient(135deg,#48dbfb,#0abde3);color:#001a22;cursor:pointer;box-shadow:0 8px 30px rgba(72,219,251,.45);transition:transform .14s,box-shadow .14s;font-family:inherit}
#ovBtn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 14px 40px rgba(72,219,251,.65)}
#ovBtn:active{transform:translateY(0) scale(.97)}
#muteBtn{position:fixed;top:16px;right:20px;z-index:13;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:transform .15s,background .15s;font-family:inherit;padding:0}
#muteBtn:hover{transform:scale(1.08);background:rgba(0,0,0,.65)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="barWrap"><div id="bar"></div></div>
<div id="hud"><div class="row"><div class="stat"><span class="label">SCORE</span><span class="value" id="scoreVal">0</span></div><div class="stat"><span class="label">BEST</span><span class="value" id="bestVal">0</span></div><div class="stat"><span class="label">LEVEL</span><span class="value" id="levelVal">1</span></div></div></div>
<button id="muteBtn" title="Mute / Unmute">🔊</button>
<div id="themeName">Dawn Plains</div>
<div id="banner"><div id="bannerTitle">LEVEL 2</div><div id="bannerSub">Emerald Forest</div><div id="bannerBonus">+250 BONUS</div></div>
<div id="overlay"><div class="panel"><h1 id="ovTitle">3D DINO RUNNER</h1><p id="ovSub">50 LEVELS · 10 WORLDS · ONE VERY FAST KAIJU</p><div id="ovControls"><div><b>SPACE / ↑ / TAP</b> Jump — press again mid-air to double jump</div><div><b>↓ / SWIPE DOWN</b> Duck under flying hazards</div></div><div id="ovScore"></div><button id="ovBtn">START</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ==================================================================
   AUDIO
   ================================================================== */
const AUDIO_BACKGROUND = 'https://commondatastorage.googleapis.com/codeskulptor-assets/Epoq-Lepidoptera.ogg';
const AUDIO_GAMEOVER   = 'https://commondatastorage.googleapis.com/codeskulptor-assets/Evillaugh.ogg';

const bgAudio = new Audio();
bgAudio.preload='auto'; bgAudio.loop=true; bgAudio.volume=0.45; bgAudio.src=AUDIO_BACKGROUND;
const overAudio = new Audio();
overAudio.preload='auto'; overAudio.volume=0.80; overAudio.src=AUDIO_GAMEOVER;
let muted = false;

function playBackground(){ if(muted)return; bgAudio.currentTime=0; const p=bgAudio.play(); if(p&&p.catch)p.catch(()=>{}); }
function stopBackground(){ try{bgAudio.pause();bgAudio.currentTime=0;}catch(e){} }
function playGameOver(){ stopBackground(); if(muted)return; overAudio.currentTime=0; const p=overAudio.play(); if(p&&p.catch)p.catch(()=>{}); }

/* ============ SETUP ============ */
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.82;
if (renderer.outputEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 1200);
camera.position.set(0, 10.5, 21);
camera.lookAt(0, 3, -15);
scene.fog = new THREE.Fog(0x2a3a5a, 75, 280);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============ CONSTANTS & STATE ============ */
const GRAVITY = 85, JUMP_V1 = 20, JUMP_V2 = 16;
const TILE = 30, TILE_N = 16;
const SPAWN_Z = -170, LEVEL_DIST = 200;
const GROUND_W = 200;
const ROAD_W   = 10;
const ROAD_HALF = ROAD_W / 2;
const KAiju_SCALE = 1.1;

const state = {
  phase:'menu', time:0, level:1,
  speed:22, baseSpeed:22, maxSpeed:55,
  distance:0, score:0,
  best: parseInt(localStorage.getItem('dinoRunnerBest') || '0', 10),
  dinoY:0, dinoVY:0, isJumping:false, jumps:0, isDucking:false,
  runPhase:0, distSinceSpawn:0, nextSpawnGap:55,
  levelUpTimer:0, victoryTimer:0,
  obstacles:[], clouds:[], mountains:[],
  groundTiles:[], roadTiles:[], curbs:[], decor:[]
};

/* ============ THEMES ============ */
const THEMES = [
  { n:'Dawn Plains',     sT:0x1e5a8a, sB:0xf59e4a, fog:0x3a5a7a, g1:0x4a8f3a, g2:0x2f6a28, mtn:0x5a4a8a, sun:0xffd8a0, hS:0x8fb8e0, hG:0x2a4a24, amb:0.20, hemi:0.38, dec:0x2a5a24, trunk:0x4a2f18, foliage:0x2a6b2a },
  { n:'Emerald Forest',  sT:0x1a4a7a, sB:0x7ed8a0, fog:0x2a5a4a, g1:0x2a6f2a, g2:0x1a4a1a, mtn:0x2a4a6a, sun:0xfff0c0, hS:0x8fd8b0, hG:0x1a3a18, amb:0.20, hemi:0.38, dec:0x1a3f1a, trunk:0x3f2a18, foliage:0x1e5a20 },
  { n:'Golden Desert',   sT:0xc06020, sB:0xffc860, fog:0x9a7038, g1:0xb08030, g2:0x8a5a20, mtn:0x8a5a30, sun:0xffd080, hS:0xffb060, hG:0x6a4418, amb:0.22, hemi:0.35, dec:0x8a6028, trunk:0x5a4018, foliage:0x7a6a20 },
  { n:'Frozen Peaks',    sT:0x4a7aa8, sB:0xb8d8e8, fog:0x8aaac0, g1:0xa0c0d0, g2:0x7a9fb0, mtn:0x6a88a0, sun:0xd0eaff, hS:0xa0c8e0, hG:0x6a8a9a, amb:0.26, hemi:0.42, dec:0x8aa8b8, trunk:0x3a2f24, foliage:0x1e4a3a },
  { n:'Crimson Canyon',  sT:0x8a2010, sB:0xe8853a, fog:0x8a4020, g1:0x8a3820, g2:0x5a2010, mtn:0x6a2818, sun:0xffa050, hS:0xd86a30, hG:0x4a1810, amb:0.22, hemi:0.38, dec:0x6a2818, trunk:0x4a2010, foliage:0x6a2a18 },
  { n:'Twilight Marsh',  sT:0x2a1a4a, sB:0xc86a5a, fog:0x4a3a5a, g1:0x2a4a2a, g2:0x1a2f1a, mtn:0x3a2a5a, sun:0xff8a70, hS:0x6a4a8a, hG:0x1a2a1a, amb:0.22, hemi:0.38, dec:0x1a2f1a, trunk:0x2f1a10, foliage:0x1a3a28 },
  { n:'Midnight Tundra', sT:0x06142a, sB:0x2a4a6a, fog:0x1a2a44, g1:0x2f4454, g2:0x1e2f3f, mtn:0x1a2a44, sun:0x7aa8d8, hS:0x3a5a80, hG:0x1a2028, amb:0.24, hemi:0.40, dec:0x25333f, trunk:0x1a140e, foliage:0x1a2a30 },
  { n:'Volcanic Wastes', sT:0x14040a, sB:0xd84a1a, fog:0x4a1008, g1:0x2a1a1a, g2:0x1a1010, mtn:0x2a1010, sun:0xff6028, hS:0xc04020, hG:0x0a0404, amb:0.26, hemi:0.36, dec:0x2a1010, trunk:0x1a0a05, foliage:0x3a1a10 },
  { n:'Aurora Fields',   sT:0x06124a, sB:0x1e9a5a, fog:0x0e2a3a, g1:0x1a3a4a, g2:0x0e2430, mtn:0x0e1e3a, sun:0x5affa0, hS:0x20c880, hG:0x0a1a20, amb:0.24, hemi:0.42, dec:0x0e2a30, trunk:0x1a2028, foliage:0x0e3a3a },
  { n:'Cosmic Void',     sT:0x06001a, sB:0x5a1ab2, fog:0x1a0840, g1:0x1a0a3a, g2:0x0e0524, mtn:0x14082a, sun:0xa060e0, hS:0x5a20b0, hG:0x08031a, amb:0.26, hemi:0.42, dec:0x1a0a30, trunk:0x14081a, foliage:0x2a0a3a }
];

/* ============ LIGHTS ============ */
const ambient = new THREE.AmbientLight(0xffffff, 0.20); scene.add(ambient);
const hemi = new THREE.HemisphereLight(0x8fb8e0, 0x2a4a24, 0.38); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffd8a0, 0.72);
sun.position.set(-32, 55, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 260;
sun.shadow.camera.left = -70; sun.shadow.camera.right = 70;
sun.shadow.camera.top = 70; sun.shadow.camera.bottom = -70;
sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.03;
scene.add(sun);
sun.target.position.set(0, 0, -40); scene.add(sun.target);
const rim = new THREE.DirectionalLight(0x6a9ac8, 0.22);
rim.position.set(24, 18, -50); scene.add(rim);

/* ============ SKY DOME ============ */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    topColor:    { value: new THREE.Color(THEMES[0].sT) },
    bottomColor: { value: new THREE.Color(THEMES[0].sB) },
    offset:      { value: 60 },
    exponent:    { value: 0.72 }
  },
  vertexShader: 'varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.0);vW=w.xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader: 'uniform vec3 topColor;uniform vec3 bottomColor;uniform float offset;uniform float exponent;varying vec3 vW;void main(){float h=normalize(vW+vec3(0.0,offset,0.0)).y;gl_FragColor=vec4(mix(bottomColor,topColor,max(pow(max(h,0.0),exponent),0.0)),1.0);}'
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), skyMat));

/* ==================================================================
   KAIJU — detailed low-poly Godzilla-style creature
   ================================================================== */
const dino = new THREE.Group();
scene.add(dino);
const dinoInner = new THREE.Group();
dinoInner.scale.setScalar(KAiju_SCALE);
dinoInner.rotation.y = Math.PI;
dino.add(dinoInner);

function paintGeo(geo, fn) {
  const p = geo.attributes.position;
  const arr = new Float32Array(p.count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    fn(c, p.getX(i), p.getY(i), p.getZ(i));
    arr[i*3] = c.r; arr[i*3+1] = c.g; arr[i*3+2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return geo;
}
const kaijuMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.65, metalness: 0.05 });

/* --- BULKY BODY (wider, heavier than the T-Rex) --- */
const bodyGeo = new THREE.BoxGeometry(1.15, 1.15, 1.0, 4, 4, 4);
paintGeo(bodyGeo, (c, x, y, z) => {
  const t = (y + 0.575) / 1.15;
  const d = (z + 0.5) / 1.0;
  c.setRGB(0.08 + t * 0.35, 0.42 - t * 0.10, 0.12 + d * 0.28);
});
const body = new THREE.Mesh(bodyGeo, kaijuMat);
body.position.set(0, 1.35, 0); body.castShadow = true;
dinoInner.add(body);

/* --- THICK NECK --- */
const neckGeo = new THREE.CylinderGeometry(0.32, 0.42, 0.5, 9);
paintGeo(neckGeo, (c, x, y) => { const t = (y + 0.25) / 0.5; c.setRGB(0.10 + t * 0.28, 0.40 - t * 0.08, 0.16 + t * 0.20); });
const neck = new THREE.Mesh(neckGeo, kaijuMat);
neck.position.set(0, 2.05, 0.10); neck.castShadow = true;
dinoInner.add(neck);

/* --- MENACING HEAD --- */
const headGeo = new THREE.BoxGeometry(0.85, 0.62, 0.85, 3, 3, 3);
paintGeo(headGeo, (c, x, y, z) => { const t = (y + 0.31) / 0.62; const d = (z + 0.425) / 0.85; c.setRGB(0.12 + t * 0.28, 0.46 - t * 0.10, 0.16 + d * 0.22); });
const head = new THREE.Mesh(headGeo, kaijuMat);
head.position.set(0, 2.55, 0.15); head.castShadow = true;
dinoInner.add(head);

/* --- SNOUT (shorter, blockier) --- */
const snoutGeo = new THREE.BoxGeometry(0.62, 0.42, 0.45);
paintGeo(snoutGeo, (c) => c.setRGB(0.55, 0.18, 0.22));
const snout = new THREE.Mesh(snoutGeo, kaijuMat);
snout.position.set(0, 2.42, 0.62);
dinoInner.add(snout);

/* --- JAW --- */
const jawGeo = new THREE.BoxGeometry(0.58, 0.16, 0.42);
paintGeo(jawGeo, (c) => c.setRGB(0.38, 0.10, 0.14));
const jaw = new THREE.Mesh(jawGeo, kaijuMat);
jaw.position.set(0, 2.20, 0.62);
dinoInner.add(jaw);

/* --- BROW RIDGE --- */
const browGeo = new THREE.BoxGeometry(0.72, 0.12, 0.3);
paintGeo(browGeo, (c) => c.setRGB(0.14, 0.34, 0.12));
const brow = new THREE.Mesh(browGeo, kaijuMat);
brow.position.set(0, 2.72, 0.45);
dinoInner.add(brow);

/* --- FIERY EYES --- */
const eyeWMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
const eyePMat = new THREE.MeshBasicMaterial({ color: 0x080810 });
[-0.26, 0.26].forEach(x => {
  const w = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 8), eyeWMat);
  w.position.set(x, 2.62, 0.55); dinoInner.add(w);
  const p = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), eyePMat);
  p.position.set(x, 2.62, 0.63); dinoInner.add(p);
});

/* --- DORSAL PLATES — the iconic Godzilla maple-leaf spikes --- */
const plateMat = new THREE.MeshStandardMaterial({ color: 0x2a1a0a, flatShading: true, roughness: 0.7, emissive: 0x1a0a00, emissiveIntensity: 0.3 });
const plateGeoTall = new THREE.ConeGeometry(0.14, 0.55, 4);
const plateGeoMed  = new THREE.ConeGeometry(0.12, 0.42, 4);
const plateGeoSmall= new THREE.ConeGeometry(0.10, 0.30, 4);

for (let i = 0; i < 9; i++) {
  const t = i / 8;
  const s = Math.sin(t * Math.PI) * 0.8 + 0.4;
  let geo;
  if (i < 3) geo = plateGeoSmall;
  else if (i < 6) geo = plateGeoMed;
  else geo = plateGeoTall;

  const plate = new THREE.Mesh(geo, plateMat);
  plate.position.set(0, 2.10 - i * 0.14, -0.25 - i * 0.12);
  plate.scale.set(s, s, s);
  plate.rotation.x = -0.25;
  plate.castShadow = true;
  dinoInner.add(plate);
}

/* --- MASSIVE ARMS --- */
const armUGeo = new THREE.BoxGeometry(0.18, 0.42, 0.18);
paintGeo(armUGeo, (c) => c.setRGB(0.18, 0.40, 0.18));
const armLGeo = new THREE.BoxGeometry(0.15, 0.38, 0.15);
paintGeo(armLGeo, (c) => c.setRGB(0.15, 0.36, 0.15));
const clawMat = new THREE.MeshStandardMaterial({ color: 0xddccaa, flatShading: true, roughness: 0.5 });
[-1, 1].forEach(side => {
  const up = new THREE.Mesh(armUGeo, kaijuMat);
  up.position.set(side * 0.58, 1.55, 0.30); up.rotation.z = side * 0.35; up.castShadow = true;
  dinoInner.add(up);
  const lo = new THREE.Mesh(armLGeo, kaijuMat);
  lo.position.set(side * 0.70, 1.22, 0.42); lo.rotation.z = side * 0.20; lo.castShadow = true;
  dinoInner.add(lo);
  for (let ci = 0; ci < 3; ci++) {
    const claw = new THREE.Mesh(new THREE.ConeGeometry(0.025, 0.10, 3), clawMat);
    claw.position.set(side * (0.70 + ci * 0.04 - 0.04), 1.02, 0.42 + ci * 0.03);
    claw.rotation.x = -0.3;
    dinoInner.add(claw);
  }
});

/* --- POWERFUL HIND LEGS --- */
const thighGeo = new THREE.BoxGeometry(0.42, 0.72, 0.48);
paintGeo(thighGeo, (c, x, y) => { const t = (y + 0.36) / 0.72; c.setRGB(0.07 + t * 0.16, 0.36 + t * 0.14, 0.12 + t * 0.12); });
const shinGeo = new THREE.BoxGeometry(0.30, 0.62, 0.34);
paintGeo(shinGeo, (c, x, y) => { const t = (y + 0.31) / 0.62; c.setRGB(0.06 + t * 0.12, 0.32 + t * 0.12, 0.10 + t * 0.10); });
const footGeo = new THREE.BoxGeometry(0.38, 0.18, 0.58);
paintGeo(footGeo, (c) => c.setRGB(0.08, 0.28, 0.10));

const legGroups = [];
[-0.42, 0.42].forEach(x => {
  const g = new THREE.Group();
  g.position.set(x, 0.75, -0.05);
  dinoInner.add(g);
  const thigh = new THREE.Mesh(thighGeo, kaijuMat); thigh.castShadow = true; g.add(thigh);
  const shin = new THREE.Mesh(shinGeo, kaijuMat); shin.position.set(0, -0.48, 0.14); shin.castShadow = true; g.add(shin);
  const foot = new THREE.Mesh(footGeo, kaijuMat); foot.position.set(0, -0.82, 0.24); foot.castShadow = true; g.add(foot);
  for (let ci = 0; ci < 3; ci++) {
    const toe = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.18, 3), clawMat);
    toe.position.set((ci - 1) * 0.11, -0.90, 0.50);
    toe.rotation.x = Math.PI / 2;
    g.add(toe);
  }
  legGroups.push(g);
});

/* --- LONG THICK TAIL --- */
const tail1Geo = new THREE.CylinderGeometry(0.38, 0.30, 1.0, 8);
paintGeo(tail1Geo, (c, x, y) => { const t = (y + 0.5) / 1.0; c.setRGB(0.08 + t * 0.18, 0.38 + t * 0.12, 0.12 + t * 0.14); });
const tail1 = new THREE.Mesh(tail1Geo, kaijuMat);
tail1.rotation.x = -Math.PI / 2 - 0.25;
tail1.position.set(0, 1.30, -1.15); tail1.castShadow = true;
dinoInner.add(tail1);

const tail2Geo = new THREE.CylinderGeometry(0.30, 0.18, 1.2, 8);

  ctx.fillStyle = '#' + new THREE.Color(theme.g1).getHexString(); ctx.fillRect(0, 0, s, s);
  ctx.fillStyle = '#' + new THREE.Color(theme.g2).getHexString();
  for (let i = 0; i < 45; i++) {

    ctx.beginPath(); ctx.arc(Math.random() * s, Math.random() * s, 12 + Math.random() * 28, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (let i = 0; i < 600; i++) {

    ctx.fillRect(Math.random() * s, Math.random() * s, 1 + Math.random() * 3, 2 + Math.random() * 4);

}

function makeCactus() {

  const cap = new THREE.Mesh(new THREE.SphereGeometry(TR * 0.92, 10, 8), cactusMat); cap.position.y = TH; cap.scale.y = 0.8; cap.castShadow = true; g.add(cap);
  for (let i = 0; i < 5; i++) { const a = (i / 5) * Math.PI * 2; const petal = new THREE.Mesh(new THREE.ConeGeometry(0.065, 0.16, 5), flowerMat); petal.position.set(Math.cos(a) * 0.06, TH + 0.14, Math.sin(a) * 0.06); petal.rotation.z = -Math.cos(a) * 0.7; petal.rotation.x = Math.sin(a) * 0.7; g.add(petal); }
  const fCenter = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), flowerMat2); fCenter.position.y = TH + 0.17; g.add(fCenter);
  const armLR = 0.15, armLHor = 0.32, armLVer = 0.85, armLY = TH * 0.52;
  const armLH = new THREE.Mesh(new THREE.CylinderGeometry(armLR * 0.9, armLR, armLHor, 8), cactusMat2); armLH.position.set(-TR - armLHor * 0.4, armLY, 0); armLH.rotation.z = Math.PI / 2; armLH.castShadow = true; g.add(armLH);
  const armLV = new THREE.Mesh(new THREE.CylinderGeometry(armLR * 0.9, armLR, armLVer, 8), cactusMat2); armLV.position.set(-TR - armLHor * 0.8, armLY + armLVer * 0.15, 0); armLV.castShadow = true; g.add(armLV);
  const armLTop = new THREE.Mesh(new THREE.SphereGeometry(armLR * 0.9, 8, 6), cactusMat2); armLTop.position.set(-TR - armLHor * 0.8, armLY + armLVer * 0.15 + armLVer / 2, 0); armLTop.scale.y = 0.8; armLTop.castShadow = true; g.add(armLTop);
  const armRR = 0.14, armRHor = 0.28, armRVer = 0.65, armRY = TH * 0.68;
  const armRH = new THREE.Mesh(new THREE.CylinderGeometry(armRR * 0.9, armRR, armRHor, 8), cactusMat3); armRH.position.set(TR + armRHor * 0.4, armRY, 0); armRH.rotation.z = Math.PI / 2; armRH.castShadow = true; g.add(armRH);
  const armRV = new THREE.Mesh(new THREE.CylinderGeometry(armRR * 0.9, armRR, armRVer, 8), cactusMat3); armRV.position.set(TR + armRHor * 0.8, armRY + armRVer * 0.15, 0); armRV.castShadow = true; g.add(armRV);
  const armRTop = new THREE.Mesh(new THREE.SphereGeometry(armRR * 0.9, 8, 6), cactusMat3); armRTop.position.set(TR + armRHor * 0.8, armRY + armRVer * 0.15 + armRVer / 2, 0); armRTop.scale.y = 0.8; armRTop.castShadow = true; g.add(armRTop);

/* ============ SPAWNING ============ */
function pickObstacleType() { const L = state.level; const bag = ['cactus','cactus','cactus','cactus']; if (L >= 2) bag.push('cluster'); if (L >= 3) bag.push('tall'); if (L >= 5) bag.push('bird'); if (L >= 8) bag.push('cluster','tall','bird'); if (L >= 12) bag.push('bird','birdHigh'); if (L >= 18) bag.push('tall','tall','bird','cluster'); if (L >= 25) bag.push('birdHigh','cluster','tall'); if (L >= 35) bag.push('tall','bird','birdHigh','cluster','tall'); return bag[(Math.random() * bag.length) | 0]; }
function spawnObstacle() {
  const type = pickObstacleType();
  let mesh, hw, hh, hd, cy, isFlying = false;
  if (type === 'cactus')      { mesh = makeCactus();  hw = 0.65; hh = 0.80; hd = 0.30; cy = 0.80; }
  else if (type === 'cluster'){ mesh = makeCluster(); hw = 0.85; hh = 0.82; hd = 0.65; cy = 0.82; }
  else if (type === 'tall')   { mesh = makeTall();    hw = 0.90; hh = 1.50; hd = 0.80; cy = 1.50; }
  else if (type === 'bird')   { mesh = makeBird();    hw = 0.90; hh = 0.60; hd = 0.70; cy = 0;    isFlying = true; }
  else                        { mesh = makeBird(); mesh.scale.setScalar(1.15); hw = 1.05; hh = 0.70; hd = 0.80; cy = 0; isFlying = true; }
  const x = 0;
  const baseY = isFlying ? (type === 'bird' ? 2.5 : 4.4) : 0;
  mesh.position.set(x, baseY, SPAWN_Z);
  mesh.userData.baseY = baseY; mesh.userData.flying = isFlying; mesh.userData.bobPhase = Math.random() * Math.PI * 2;
  scene.add(mesh);
  state.obstacles.push({ mesh, hw, hh, hd, cy, isFlying, type });
}

/* ============ INPUT ============ */
function jump() { if (state.phase !== 'playing') return; if (state.jumps >= 2) return; state.jumps++; state.dinoVY = state.jumps === 1 ? JUMP_V1 : JUMP_V2; state.isJumping = true; state.isDucking = false; }
function startDuck() { if (state.phase !== 'playing') return; if (!state.isJumping) state.isDucking = true; else state.dinoVY -= 14; }
function stopDuck() { state.isDucking = false; }

addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); if (e.repeat) return; if (state.phase === 'menu' || state.phase === 'gameover' || state.phase === 'victory') startGame(); else jump(); }
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); startDuck(); }
  else if (e.code === 'KeyR') { if (state.phase === 'gameover' || state.phase === 'victory') startGame(); }
}, { passive: false });
addEventListener('keyup', (e) => { if (e.code === 'ArrowDown' || e.code === 'KeyS') stopDuck(); });

let pointerActive = false;
addEventListener('pointerdown', (e) => {
  if (state.phase !== 'playing') return;
  if (e.target && e.target.closest && e.target.closest('#overlay')) return;
  if (e.target && e.target.id === 'muteBtn') return;
  pointerActive = true;
  if (e.clientY > innerHeight * 0.62) startDuck(); else jump();
});
addEventListener('pointerup', () => { if (pointerActive) { stopDuck(); pointerActive = false; } });
addEventListener('pointercancel', () => { stopDuck(); pointerActive = false; });

const ovScore = document.getElementById('ovScore'); const ovBtn = document.getElementById('ovBtn');
const banner = document.getElementById('banner'); const bannerTitle = document.getElementById('bannerTitle'); const bannerSub = document.getElementById('bannerSub'); const bannerBonus = document.getElementById('bannerBonus');
const muteBtn = document.getElementById('muteBtn'); bestEl.textContent = state.best;

muteBtn.addEventListener('click', (e) => { e.stopPropagation(); muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊'; if (muted) { bgAudio.pause(); overAudio.pause(); } else if (state.phase === 'playing') playBackground(); });

/* ============ THEME APPLY ============ */
function applyTheme(idx) {
  const t = THEMES[idx % THEMES.length];
  skyMat.uniforms.topColor.value.setHex(t.sT); skyMat.uniforms.bottomColor.value.setHex(t.sB);
  scene.fog.color.setHex(t.fog); ambient.intensity = t.amb; hemi.intensity = t.hemi;
  hemi.color.setHex(t.hS); hemi.groundColor.setHex(t.hG); sun.color.setHex(t.sun);
  mountainMat.color.setHex(t.mtn); horizonMat.color.setHex(t.g2);
  trunkMat.color.setHex(t.trunk); foliageMat.color.setHex(t.foliage); bushMat.color.setHex(t.dec);
  rockMat2.color.setHex(t.dec); rockMat2.color.offsetHSL(0, -0.10, -0.05);
  grassMat.color.setHex(t.foliage); grassMat.color.offsetHSL(0, 0.1, 0.05);
  if (groundMat.map) groundMat.map.dispose(); groundMat.map = makeGroundTexture(t); groundMat.needsUpdate = true;
  themeEl.textContent = t.n;
}

/* ============ START / END ============ */
function startGame() {
  state.phase = 'playing'; state.level = 1; state.speed = state.baseSpeed;
  state.distance = 0; state.score = 0; state.dinoY = 0; state.dinoVY = 0;
  state.isJumping = false; state.jumps = 0; state.isDucking = false;
  state.runPhase = 0; state.distSinceSpawn = 40; state.nextSpawnGap = 60;
  state.levelUpTimer = 0; state.victoryTimer = 0;
  state.obstacles.forEach(o => scene.remove(o.mesh)); state.obstacles = [];
  dino.position.set(0, 0, 0);
  dinoInner.scale.set(KAiju_SCALE, KAiju_SCALE, KAiju_SCALE);
  dinoInner.rotation.set(0, Math.PI, 0); dinoInner.position.set(0, 0, 0);
  state.groundTiles.forEach((t, i) => { t.position.z = 15 - i * TILE; });
  state.roadTiles.forEach((t, i) => { t.position.z = 15 - i * TILE; });
  state.curbs.forEach((c, i) => { c.position.z = 15 - Math.floor(i / 2) * TILE; });
  state.decor.forEach(d => { d.position.z = 15 - Math.random() * (TILE * TILE_N); });
  applyTheme(0); banner.classList.remove('show'); updateHUD(); barEl.style.width = '0%';
  overlay.classList.add('hidden'); ovTitle.textContent = '3D DINO RUNNER'; ovSub.textContent = '50 LEVELS · 10 WORLDS · ONE VERY FAST KAIJU';
  ovScore.textContent = ''; ovBtn.textContent = 'START'; playBackground();
}
function gameOver() {
  if (state.phase !== 'playing') return; state.phase = 'gameover'; playGameOver();
  const finalScore = Math.floor(state.score);
  if (finalScore > state.best) { state.best = finalScore; localStorage.setItem('dinoRunnerBest', state.best); bestEl.textContent = state.best; }
  overlay.classList.remove('hidden'); ovTitle.textContent = 'GAME OVER'; ovSub.textContent = 'The obstacle won this round.';
  ovScore.textContent = `Score: ${finalScore}  ·  Best: ${state.best}  ·  Level: ${state.level}`; ovBtn.textContent = 'PLAY AGAIN'; banner.classList.remove('show');
}
function triggerVictory() {
  if (state.phase !== 'playing') return; state.phase = 'victory'; stopBackground();
  const finalScore = Math.floor(state.score);
  if (finalScore > state.best) { state.best = finalScore; localStorage.setItem('dinoRunnerBest', state.best); bestEl.textContent = state.best; }
  overlay.classList.remove('hidden'); ovTitle.textContent = 'VICTORY!'; ovSub.textContent = 'You survived all 50 levels.';
  ovScore.textContent = `Final Score: ${finalScore}  ·  Best: ${state.best}`; ovBtn.textContent = 'RUN AGAIN'; banner.classList.remove('show');
}
function updateHUD() { scoreEl.textContent = Math.floor(state.score); levelEl.textContent = state.level; bestEl.textContent = state.best; const inLevel = state.distance % LEVEL_DIST; barEl.style.width = ((inLevel / LEVEL_DIST) * 100).toFixed(1) + '%'; }

/* ============ COLLISION (AABB) ============ */
function checkCollisions() {
  const dinoHW = 0.70; const dinoHH = state.isDucking ? 0.65 : 1.15; const dinoHD = 0.60;
  const dinoYc = state.dinoY + dinoHH;
  for (let i = 0; i < state.obstacles.length; i++) {
    const ob = state.obstacles[i];
    const dx = Math.abs(ob.mesh.position.x - 0);
    const dz = Math.abs(ob.mesh.position.z - 0);
    if (dx > dinoHW + ob.hw + 0.30) continue;
    if (dz > dinoHD + ob.hd + 0.30) continue;
    const oyc = ob.mesh.position.y + ob.cy;
    if (Math.abs(oyc - dinoYc) < dinoHH + ob.hh) { gameOver(); return; }
  }
}

/* ============ LEVEL PROGRESSION ============ */
function updateLevel() {
  const newLevel = Math.min(50, 1 + Math.floor(state.distance / LEVEL_DIST));
  if (newLevel <= state.level) return;
  const prevTheme = Math.floor((state.level - 1) / 5); state.level = newLevel;
  const newTheme = Math.floor((state.level - 1) / 5);
  state.speed = Math.min(state.maxSpeed, state.baseSpeed + (state.level - 1) * ((state.maxSpeed - state.baseSpeed) / 49));
  if (newTheme !== prevTheme) applyTheme(newTheme);
  const bonus = 250; state.score += bonus;
  bannerTitle.textContent = 'LEVEL ' + state.level; bannerSub.textContent = THEMES[newTheme % THEMES.length].n;
  bannerBonus.textContent = '+' + bonus + ' BONUS'; banner.classList.add('show'); state.levelUpTimer = 1.6;
  if (state.level >= 50) state.victoryTimer = 2.0;
}

/* ============ ANIMATION ============ */
function animateDino(dt) {
  const duckT = state.isDucking ? 0.55 : 1.0;
  const curSY = dinoInner.scale.y / KAiju_SCALE;
  const newSY = curSY + (duckT - curSY) * Math.min(1, dt * 18);
  dinoInner.scale.set(KAiju_SCALE, KAiju_SCALE * newSY, KAiju_SCALE);
  if (state.phase === 'playing' || state.phase === 'menu') {
    state.runPhase += dt * (state.phase === 'playing' ? state.speed * 0.85 : 8);
    legGroups.forEach((leg, i) => { const phase = i * Math.PI; const target = state.isJumping ? -0.65 : Math.sin(state.runPhase + phase) * 0.75; leg.rotation.x += (target - leg.rotation.x) * Math.min(1, dt * 22); });
    tail1.rotation.z = Math.sin(state.runPhase * 0.9) * 0.10;
    tail2.rotation.z = Math.sin(state.runPhase * 0.9 + 0.5) * 0.08;
    tail3.rotation.z = Math.sin(state.runPhase * 0.9 + 1.0) * 0.06;
    head.rotation.z = Math.sin(state.runPhase * 1.2) * 0.03;
    head.rotation.x = state.isJumping ? -0.10 : Math.sin(state.runPhase * 1.2) * 0.02;
    if (!state.isJumping) dinoInner.position.y = Math.abs(Math.sin(state.runPhase)) * 0.06; else dinoInner.position.y = 0;
  } else {
    legGroups.forEach(leg => { leg.rotation.x += (-0.20 - leg.rotation.x) * Math.min(1, dt * 8); });
  }
}
function animateClouds(dt) {
  const move = state.speed * dt * 0.28;
  state.clouds.forEach((c, i) => { c.position.z += move; c.position.x += Math.sin(state.time * 0.4 + i) * 0.008; if (c.position.z > 70) { c.position.z = -300 - Math.random() * 80; c.position.x = (Math.random() - 0.5) * 120; c.position.y = 20 + Math.random() * 20; } });
}
function animateGround(dt) {
  const move = state.speed * dt;
  state.groundTiles.forEach(t => { t.position.z += move; if (t.position.z > 15 + TILE) t.position.z -= TILE * TILE_N; });
  state.roadTiles.forEach(t => { t.position.z += move; if (t.position.z > 15 + TILE) t.position.z -= TILE * TILE_N; });
  state.curbs.forEach(c => { c.position.z += move; if (c.position.z > 15 + TILE) c.position.z -= TILE * TILE_N; });
  state.decor.forEach(d => { d.position.z += move; if (d.position.z > 20) { const side = Math.random() < 0.5 ? -1 : 1; const scaleGuess = Math.abs(d.userData.baseX || 10); const band = scaleGuess > 30 ? [12, 40] : scaleGuess > 15 ? [9, 25] : [6.5, 16]; d.position.x = side * (band[0] + Math.random() * (band[1] - band[0])); d.position.z -= TILE * TILE_N; } });
}
function animateObstacles(dt) {
  const move = state.speed * dt;
  for (let i = state.obstacles.length - 1; i >= 0; i--) {
    const ob = state.obstacles[i]; ob.mesh.position.z += move;
    if (ob.isFlying) { ob.mesh.position.y = ob.mesh.userData.baseY + Math.sin(state.time * 3 + ob.mesh.userData.bobPhase) * 0.18; ob.mesh.rotation.z = Math.sin(state.time * 2.5 + ob.mesh.userData.bobPhase) * 0.14; const wings = ob.mesh.userData.wings; if (wings) wings.forEach((w, wi) => { w.rotation.x = Math.sin(state.time * 11 + wi * Math.PI) * 0.7; }); }
    if (ob.type === 'tall') ob.mesh.rotation.y += dt * 0.6;
    if (ob.mesh.position.z > 18) { scene.remove(ob.mesh); state.obstacles.splice(i, 1); }
  }
}

/* ============ UPDATE ============ */
function update(dt) {
  if (state.phase === 'playing' || state.phase === 'gameover' || state.phase === 'victory') { animateClouds(dt); animateGround(dt); animateObstacles(dt); }
  else { state.clouds.forEach((c, i) => { c.position.x += Math.sin(state.time * 0.3 + i) * 0.01; }); }
  animateDino(dt);
  if (state.levelUpTimer > 0) { state.levelUpTimer -= dt; if (state.levelUpTimer <= 0) banner.classList.remove('show'); }
  if (state.phase !== 'playing') {
    if (state.phase === 'menu') { const t = state.time; camera.position.x = Math.sin(t * 0.4) * 0.8; camera.position.y = 10.5 + Math.sin(t * 0.5) * 0.3; camera.lookAt(0, 3, -15); }
    else { camera.position.x += (0 - camera.position.x) * Math.min(1, dt * 3); camera.position.y += (10.5 - camera.position.y) * Math.min(1, dt * 3); camera.lookAt(0, 3, -15); }
    return;
  }
  if (state.isJumping) { state.dinoVY -= GRAVITY * dt; state.dinoY += state.dinoVY * dt; if (state.dinoY <= 0) { state.dinoY = 0; state.dinoVY = 0; state.isJumping = false; state.jumps = 0; } }
  dino.position.y = state.dinoY;
  const move = state.speed * dt; state.distance += move; state.score += move * 0.5; state.distSinceSpawn += move;
  if (state.distSinceSpawn >= state.nextSpawnGap) { state.distSinceSpawn = 0; const t = Math.max(1.0, 1.68 - (state.level - 1) * 0.014); state.nextSpawnGap = (t * state.speed) * (0.82 + Math.random() * 0.5); spawnObstacle(); }
  checkCollisions(); updateLevel(); updateHUD();
  if (state.victoryTimer > 0) { state.victoryTimer -= dt; if (state.victoryTimer <= 0) triggerVictory(); }
  camera.position.x = 0; camera.position.y = 10.5 + state.dinoY * 0.15; camera.lookAt(0, 3 + state.dinoY * 0.3, -15);
}

/* ============ GAME LOOP ============ */
let lastT = performance.now();
function gameLoop(now) { requestAnimationFrame(gameLoop); const dt = Math.min((now - lastT) / 1000, 0.05); lastT = now; state.time += dt; update(dt); renderer.render(scene, camera); }
ovBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
updateHUD(); requestAnimationFrame(gameLoop);

})();
</script>
</body>
</html>
